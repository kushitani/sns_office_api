# 概要: PostgreSQL上のMigration・API試験とRuff検査を継続的に実行します。
name: Backend checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sns_office_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      JWT_SECRET: ci-test-secret-not-for-production-0000000000
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/sns_office_test
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/sns_office_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
