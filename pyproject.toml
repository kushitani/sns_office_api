# 概要: アプリと開発用ツールの依存、Pythonの対応版、テスト・静的検査の設定をまとめます。
[project]
name = "sns-office-api"
version = "0.1.0"
description = "AI SNS OFFICE modular monolith backend"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3", "pydantic[email]>=2.9,<3", "PyJWT>=2.9,<3", "pwdlib[argon2]>=0.2,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.7,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sns_office"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
